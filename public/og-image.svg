<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Gradient Glow -->
  <circle cx="600" cy="150" r="350" fill="#0070f3" opacity="0.15" filter="blur(80px)"/>
  <circle cx="900" cy="400" r="250" fill="#50e3c2" opacity="0.1" filter="blur(60px)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Badge Top -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#171717" stroke="#333333" stroke-width="1"/>
    <text x="85" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#50e3c2" text-anchor="middle">✦ UangKasir v2.0</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">UangKasir<tspan fill="#0070f3">.</tspan></text>
  <text x="80" y="305" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#a1a1a1">Sistem Pencatatan Kas Keuangan Sederhana Usaha &amp; Kasir</text>

  <!-- Feature Chips -->
  <g transform="translate(80, 420)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#171717" stroke="#262626" stroke-width="1"/>
    <text x="110" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">⚡ Multi-Role Access</text>

    <!-- Chip 2 -->
    <rect x="240" y="0" width="220" height="48" rx="24" fill="#171717" stroke="#262626" stroke-width="1"/>
    <text x="350" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">📊 Laporan Excel &amp; PDF</text>

    <!-- Chip 3 -->
    <rect x="480" y="0" width="220" height="48" rx="24" fill="#171717" stroke="#262626" stroke-width="1"/>
    <text x="590" y="29" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">📲 PWA iPhone &amp; Android</text>
  </g>

  <!-- Private Tag Bottom Right -->
  <g transform="translate(920, 490)">
    <rect x="0" y="0" width="190" height="32" rx="6" fill="#ee0000" opacity="0.15" stroke="#ee0000" stroke-width="1"/>
    <text x="95" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ee0000" text-anchor="middle">🔒 PRIVATE SYSTEM</text>
  </g>
</svg>
